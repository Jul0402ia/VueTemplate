<!DOCTYPE html>
<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Vue CRUD Template</title>
</head>

<body>

    <div id="app" class="container mt-4">

        <h1>Mine objekter</h1>

        <button @click="getAllItems" class="btn btn-primary mb-3">
            Hent data
        </button>

        <button @click="sortItems" class="btn btn-secondary mb-3">
            Sorter
        </button>

        <div v-if="error" class="alert alert-danger">
            Der skete en fejl. Tjek Console.
        </div>

        <input
            v-model="searchText"
            class="form-control mb-3"
            placeholder="Søg">

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Property1</th>
                    <th>Property2</th>
                    <th>Number</th>
                    <th>Opdater</th>
                    <th>Slet</th>
                </tr>
            </thead>

            <tbody>
                <tr v-for="item in filteredItems" :key="item.id">

                    <td>{{ item.id }}</td>

                    <td>
                        <input v-model="item.property1" class="form-control">
                    </td>

                    <td>
                        <input v-model="item.property2" class="form-control">
                    </td>

                    <td>
                        <input v-model.number="item.numberProperty" class="form-control">
                    </td>

                    <td>
                        <button @click="updateItem(item)" class="btn btn-warning btn-sm">
                            Opdater
                        </button>
                    </td>

                    <td>
                        <button @click="deleteItem(item.id)" class="btn btn-danger btn-sm">
                            Slet
                        </button>
                    </td>

                </tr>
            </tbody>

        </table>

        <hr>

        <h3>Opret nyt objekt</h3>

        <input
            v-model="newProperty1"
            class="form-control mb-2"
            placeholder="Property1">

        <input
            v-model="newProperty2"
            class="form-control mb-2"
            placeholder="Property2">

        <input
            v-model.number="newNumberProperty"
            class="form-control mb-2"
            placeholder="Number">

        <button @click="createItem" class="btn btn-success">
            Opret
        </button>

    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>

</body>

</html>
